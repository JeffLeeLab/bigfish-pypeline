# Temporary development env for the Streamlit optimisation app.
# Set up (from repo root):  conda env create -f test/streamlit/bigfish-optimise/environment.yml
name: bigfish-optimise
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.21.6
  - scipy=1.7.3
  - scikit-image=0.19.3
  - pywavelets=1.4.1  # newer versions make pip upgrade numpy when installing big-fish
  - scikit-learn=1.0.2
  - matplotlib=3.5.3
  - pandas=1.3.5
  - mrc=0.3.0
  - tifffile>=2024.6.18,<2025
  - zeroc-ice=3.6.5
  - omero-py=5.21.0
  - pyyaml
  - streamlit>=1.32,<2
  - plotly
  - pytest
  - pip
  - pip:
      - big-fish==0.6.2
