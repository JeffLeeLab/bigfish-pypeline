# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# YAML configuration for Bigfish batch processing
# Modified: 2023.03.07
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 

# - - - - - General configuration
## The number of processes in the pool of processes
number_of_workers: 1
## The directory with images
input_pattern: /Users/jefflee/Documents/Tools/bigfish-pypeline/tests/data/sypN_DAPI_Phal_jim-exon_crop.tif
## The directory where the big-fish output npz or quality control files will be stored
## These directories will be created if they don't exist
output_dir: /Users/jefflee/bigfish-testdata/reference_v1/crop/general_auto_subpixel-off/bf_output
output_qc_dir: /Users/jefflee/bigfish-testdata/reference_v1/crop/general_auto_subpixel-off/bf_output_qc

# - - - - - Bigfish configuration
## Image voxel size and PSF parameters
voxel_size_yx: 65
voxel_size_z: 200
ex: 570
em: 610
NA: 1.45
RI: 1.45
microscope: confocal
## Background subtraction radius in pixels
bg_radius: 5
## The channels for which to run the processing (0-based)
## Use [2, 3] format to quantify two smFISH channels 
channels: [2] 
## Bigfish single-spot detection parameters
auto_threshold: True
## Set up manual thresholds if not using auto-thresholding
smFISH_ch1: 2
smFISH_ch1_thresh: 18
smFISH_ch2: 3
smFISH_ch2_thresh: 30

## Intron channel
intron_channel: 3

## Bigfish dense region decomposition and clustering parameters
alpha: 0.5
beta: 1
bf_radius: 600 # in nanometer
nb_min_spots: 12
## Subpixel fitting (set to True to refine spot coordinates to sub-pixel resolution)
subpixel_fitting_mode: False
