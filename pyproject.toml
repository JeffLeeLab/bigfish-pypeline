[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bigfish-pypeline"
description = "Pre-process and quantify single-molecule Fluorescence in situ Hybridisation (smFISH) images with Big-FISH."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.scripts]
bigfish-pypeline = "bigfish_pypeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bigfish_pypeline.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "full_image: needs the full-size image in BIGFISH_TEST_DATA (slow)",
    "cellpose: needs the Cellpose model file on this computer (skipped when it is missing)",
]
